[package]
name = "listenbox-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
listenbox-sync-engine = { path = "../sync-engine" }
gpui-kit = "=0.6.6"
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.25.1", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }
futures-util = "0.3"
tempfile = "3"
serde_json = "1"

[lints]
workspace = true

[[example]]
name = "preview"
test = false
