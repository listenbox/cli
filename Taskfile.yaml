version: 3

tasks:
  mod:download:
    run: once
    cmd: go mod download
    sources:
      - go.mod
      - go.sum

  test:
    run: once
    deps:
      - mod:download
    cmd: go test -tags=dev ./...
    sources:
      - Taskfile.yaml
      - go.mod
      - go.sum
      - ./**/*.go
      - ./**/*.yaml

  lint:
    run: once
    deps:
      - mod:download
    env:
      CGO_ENABLED: 0
    cmds:
      - gofmt -w .
      - >-
        go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
        run --allow-serial-runners --timeout=15m --build-tags=dev ./...
    sources:
      - Taskfile.yaml
      - go.mod
      - go.sum
      - .golangci.yaml
      - ./**/*.go
      - ./**/*.yaml

  check:
    desc: Lint and test the CLI, then smoke-test its entrypoint directly from source.
    run: once
    deps:
      - lint
      - test
    cmd: go run ./cmd/listenbox help

  mod:tidy:
    cmd: go mod tidy

  outdated:
    run: once
    cmd: >-
      go list -u -m
      -f '{{"{{"}}if and (not .Main) (not .Indirect) .Update{{"}}"}}{{"{{"}}.Path{{"}}"}} {{"{{"}}.Version{{"}}"}} => {{"{{"}}.Update.Version{{"}}"}}{{"{{"}}end{{"}}"}}'
      all
