[package]
name = "listenbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Publish and manage podcasts with Listenbox"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
ffmpeg = { package = "ffmpeg-the-third", version = "=6.0.0", default-features = false, features = ["static", "format", "software-resampling"] }
llrt_modules = { version = "=0.8.1-beta", default-features = false, features = ["abort", "buffer", "crypto", "crypto-rust", "events", "exceptions", "fetch", "stream-web", "timers", "url", "util", "path", "intl", "tls-ring"] }
llrt_utils = { package = "llrt_utils_watts", version = "=0.8.1-beta" }
rquickjs = { version = "=0.11.0", features = ["full-async"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "signal", "process", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
