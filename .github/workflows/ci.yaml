name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: ^0.9.0
          cache: true
      - uses: pkgxdev/setup@v5
      - uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.5.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cache/ffmpeg
            ~/.pkgx
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'prepare-ffmpeg.ts') }}
      - run: nub i --frozen-lockfile
      - run: moon run cli:check
