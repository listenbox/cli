name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pkgxdev/setup@v5
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: ^0.9.0
          cache: true
          cache-dependency-path: |
            nub.lock
            package.json
      - run: nub install --frozen-lockfile
      - uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.5.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cache/ffmpeg
            ~/.pkgx
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'prepare-ffmpeg.ts') }}
      - name: Check affected tasks
        id: ci
        run: moon ci
      - name: Report Moon CI results
        if: "!cancelled() && steps.ci.outcome != 'skipped'"
        uses: moonrepo/run-report-action@v1
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          skip-comment: true
      - name: Upload Moon reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moon-reports-${{ github.run_attempt }}
          path: |
            .moon/cache/ciReport.json
            .moon/cache/runReport.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
