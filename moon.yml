toolchains:
  default: system
fileGroups:
  sources:
    - go.mod
    - go.sum
    - ./**/*.go
    - ./**/*.yaml
tasks:
  mod-download:
    inputs:
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go mod download
    options:
      cache: true
  test:
    deps:
      - ~:mod-download
    inputs:
      - moon.yml
      - go.mod
      - go.sum
      - ./**/*.go
      - ./**/*.yaml
    script: |-
      set -euo pipefail
      go test -count=1 -tags=dev ./...
    options:
      cache: true
  lint:
    env:
      CGO_ENABLED: "0"
    deps:
      - ~:mod-download
    inputs:
      - moon.yml
      - go.mod
      - go.sum
      - .golangci.yaml
      - ./**/*.go
      - ./**/*.yaml
    script: |-
      set -euo pipefail
      if [[ "${CI:-}" == "true" ]]; then
        test -z "$(gofmt -l .)"
      else
        gofmt -w .
      fi
      go vet -tags=dev ./...
      mkdir -p .cache/golangci-lint-tmp
      GOLANGCI_LINT_CACHE="${GOLANGCI_LINT_CACHE:-$PWD/.cache/golangci-lint}" \
        TMPDIR="$PWD/.cache/golangci-lint-tmp" \
        go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --timeout=15m --build-tags=dev ./...
    options:
      cache: true
  smoke:
    description: Smoke-test the CLI entrypoint directly from source.
    deps:
      - ~:mod-download
    inputs:
      - "@group(sources)"
    command: go run ./cmd/listenbox help
    options:
      cache: true
  check:
    description: Lint, test, and smoke-test the CLI.
    deps:
      - ~:lint
      - ~:test
      - ~:smoke
    inputs: []
    options:
      runInCI: false
  mod-tidy:
    options:
      runInCI: false
    script: |-
      set -euo pipefail
      go mod tidy
  outdated:
    options:
      runInCI: false
    script: >-
      set -euo pipefail

      go list -u -m -f '{{if and (not .Main) (not .Indirect) .Update}}{{.Path}} {{.Version}} =>
      {{.Update.Version}}{{end}}' all
