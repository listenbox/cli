toolchains:
  default: system
fileGroups:
  sources:
    - prepare-ffmpeg.ts
    - ffmpeg-env.sh
    - go.mod
    - go.sum
    - ./**/*.go
    - ./**/*.yaml
tasks:
  native-ffmpeg:
    description: Build pinned static FFmpeg libraries for go-astiav.
    inputs:
      - prepare-ffmpeg.ts
    command: node prepare-ffmpeg.ts
    outputs:
      - .cache/ffmpeg
    options:
      cache: true
  build:
    deps:
      - ~:mod-download
      - ~:native-ffmpeg
    inputs:
      - "@group(sources)"
    script: |-
      set -euo pipefail
      source ffmpeg-env.sh
      go build -trimpath -ldflags="-s -w" -o dist/listenbox ./cmd/listenbox
    outputs:
      - dist/listenbox
  mod-download:
    inputs:
      - go.mod
      - go.sum
    script: |-
      set -euo pipefail
      go mod download
    options:
      cache: true
  test:
    deps:
      - ~:mod-download
      - ~:native-ffmpeg
    inputs:
      - moon.yml
      - ffmpeg-env.sh
      - go.mod
      - go.sum
      - ./**/*.go
      - ./**/*.yaml
      - internal/cli/testdata/**/*
    script: |-
      set -euo pipefail
      source ffmpeg-env.sh
      go test -count=1 -tags=dev -timeout=30s ./...
    options:
      cache: true
  lint:
    deps:
      - ~:mod-download
      - ~:native-ffmpeg
    inputs:
      - moon.yml
      - ffmpeg-env.sh
      - go.mod
      - go.sum
      - .golangci.yaml
      - ./**/*.go
      - ./**/*.yaml
      - internal/cli/testdata/**/*
    script: |-
      set -euo pipefail
      source ffmpeg-env.sh
      if [[ "${CI:-}" == "true" ]]; then
        test -z "$(gofmt -l .)"
      else
        gofmt -w .
      fi
      go vet -tags=dev ./...
      mkdir -p .cache/golangci-lint-tmp
      GOLANGCI_LINT_CACHE="${GOLANGCI_LINT_CACHE:-$PWD/.cache/golangci-lint}" \
        TMPDIR="$PWD/.cache/golangci-lint-tmp" \
        go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --timeout=15m --build-tags=dev ./...
    options:
      cache: true
  smoke:
    description: Smoke-test the CLI executable.
    deps:
      - ~:build
    command: dist/listenbox help
    options:
      cache: true
  package:
    description: Package the CLI with its native media runtime and license notices.
    deps:
      - ~:build
    script: |-
      cp .cache/ffmpeg/NOTICE.txt dist/ffmpeg-NOTICE.txt
      tar -czf dist/listenbox.tar.gz -C dist listenbox ffmpeg-NOTICE.txt -C .. LICENSE
    outputs:
      - dist/listenbox.tar.gz
  check:
    description: Lint, test, and smoke-test the CLI.
    deps:
      - ~:lint
      - ~:test
      - ~:smoke
      - ~:package
    inputs: []
    options:
      runInCI: false
  mod-tidy:
    options:
      runInCI: false
    script: |-
      set -euo pipefail
      go mod tidy
  outdated:
    options:
      runInCI: false
    script: >-
      set -euo pipefail

      go list -u -m -f '{{if and (not .Main) (not .Indirect) .Update}}{{.Path}} {{.Version}} =>
      {{.Update.Version}}{{end}}' all
