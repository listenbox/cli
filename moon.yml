language: rust
toolchains:
  default: system
taskOptions:
  cache: true
fileGroups:
  sources:
    - Cargo.toml
    - Cargo.lock
    - rust-toolchain.toml
    - src/**/*.rs
    - prepare-ffmpeg.ts
    - package.json
    - nub.lock
    - .cargo/config.toml
    - moon.yml
tasks:
  benchmark-measurer:
    description: Build the Linux child-process accounting wrapper for API import benchmarks.
    script: |-
      set -euo pipefail
      mkdir -p .cache
      cc -O2 -Wall -Wextra -Werror bench/measure.c -o .cache/cli-measure
    inputs: [bench/measure.c]
    outputs: [.cache/cli-measure]
    options:
      runInCI: false
  native-ffmpeg:
    description: Build pinned FFmpeg 9 libraries for static linking through ffmpeg-the-third.
    inputs:
      - prepare-ffmpeg.ts
      - package.json
      - nub.lock
    command: nub prepare-ffmpeg.ts
    outputs:
      - .cache/ffmpeg/**/*
  prerequisites:
    deps:
      - ~:native-ffmpeg
    inputs: []
    options:
      internal: true
  build:
    deps:
      - ~:prerequisites
    inputs:
      - "@group(sources)"
    script: |-
      set -euo pipefail
      pkgx +llvm.org +cmake.org cargo build --locked
      mkdir -p dist
      cp target/debug/listenbox dist/listenbox
      cp .cache/ffmpeg/NOTICE.txt dist/FFmpeg-NOTICE.txt
    outputs:
      - dist/listenbox
      - dist/FFmpeg-NOTICE.txt
  lint:
    deps:
      - ~:prerequisites
    inputs:
      - "@group(sources)"
    script: |-
      set -euo pipefail
      cargo fmt --all
      pkgx +llvm.org +cmake.org cargo clippy --locked --all-targets -- -D warnings
  test:
    deps:
      - ~:prerequisites
    inputs:
      - "@group(sources)"
    command: pkgx +llvm.org +cmake.org cargo test --locked
  typecheck:
    inputs:
      - prepare-ffmpeg.ts
      - package.json
      - nub.lock
      - tsconfig.json
    command: nubx tsc --project tsconfig.json
  smoke:
    deps:
      - ~:build
    inputs:
      - "@group(sources)"
    command: dist/listenbox help
  build-release:
    deps: [~:prerequisites]
    inputs: ["@group(sources)"]
    script: |-
      set -euo pipefail
      pkgx +llvm.org +cmake.org cargo build --locked --release
      mkdir -p dist/release
      cp target/release/listenbox dist/release/listenbox
      cp .cache/ffmpeg/NOTICE.txt dist/release/FFmpeg-NOTICE.txt
    outputs:
      - dist/release/listenbox
      - dist/release/FFmpeg-NOTICE.txt
    options:
      runInCI: false
  package:
    deps:
      - ~:build-release
    inputs:
      - "@group(sources)"
      - LICENSE
      - THIRD-PARTY-NOTICES.txt
    script: tar -czf dist/listenbox.tar.gz -C dist/release listenbox FFmpeg-NOTICE.txt -C ../.. LICENSE THIRD-PARTY-NOTICES.txt
    outputs:
      - dist/listenbox.tar.gz
    options:
      runInCI: false
  check:
    deps:
      - ~:lint
      - ~:typecheck
      - ~:test
      - ~:smoke
      - ~:package
    inputs: []
    options:
      runInCI: false
  outdated:
    command: cargo update --dry-run
    options:
      runInCI: false
