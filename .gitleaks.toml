title = "Listenbox client publication checks"

[extend]
useDefault = true

# Git author/committer identities are public attribution. These rules scan file
# contents only, where personal machine paths and account data do not belong.
[[rules]]
id = "personal-home-path"
description = "Personal home directory in published file content"
regex = '''(?:/(?:Users|home)/[A-Za-z0-9._-]+/|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+\\)'''
keywords = ["/Users/", "/home/", "\\Users\\"]

[[rules]]
id = "personal-email"
description = "Personal email address in published file content"
regex = '''(?i)\b[a-z0-9._%+-]+@(?:gmail\.com|googlemail\.com|icloud\.com|hotmail\.com|outlook\.com|live\.com|yahoo\.com|protonmail\.com|proton\.me|pm\.me)\b'''
keywords = ["@"]
