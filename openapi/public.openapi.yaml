openapi: 3.2.0
info:
  title: Listenbox Public API
  version: "1"
paths:
  /:
    get:
      operationId: openapi
      responses:
        "200":
          description: Generated OpenAPI document.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            text/yaml:
              schema:
                $ref: "#/components/schemas/OpenAPIYAMLDocument"
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAPIJSONDocument"
        "304":
          description: Selected OpenAPI representation has not changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
    head:
      operationId: headOpenapi
      responses:
        "200":
          description: Generated OpenAPI document.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
        "304":
          description: Selected OpenAPI representation has not changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
        "400":
          description: "400"
  /cli/authorizations:
    post:
      description: Creates a fresh CLI authorization attempt. Subscribe to its events
        separately.
      operationId: createCLIAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCLIAuthorization"
      security:
        - ApiKeyAuth: []
        - {}
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCLIAuthorization"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: An optional previous API key was invalid; retry anonymously.
  /cli/authorizations/{code}/events:
    get:
      operationId: cliAuthorizationEvents
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CLIAuthorizationCode"
      security:
        - ApiKeyAuth: []
        - {}
      responses:
        "200":
          description: CLI authorization pending and terminal events.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/CLIAuthorizationEvent"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "404":
          description: Authorization attempt not found.
  /s/whoami:
    get:
      operationId: whoami
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyWhoami"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
  /s/team/members:
    get:
      operationId: listTeamMembers
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberCollection"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:read or its creator is no longer a member.
  /s/team/invitations:
    post:
      operationId: createTeamInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamInvitation"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingTeamInvitation"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "409":
          description: Email is already a member or has a pending invite.
  /s/team/invitations/{invitation_id}:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TeamInvitationID"
    put:
      operationId: updateTeamInvitationRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberRole"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingTeamInvitation"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "404":
          description: Pending invitation not found.
    delete:
      operationId: revokeTeamInvitation
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Invitation revoked.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "404":
          description: Pending invitation not found.
  /s/team/members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UserID"
    put:
      operationId: updateTeamMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberRole"
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Member role changed.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "404":
          description: Mutable team member not found.
    delete:
      operationId: removeTeamMember
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Member removed.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not an owner.
        "404":
          description: Removable team member not found.
  /s/shows:
    get:
      description: Lists shows accessible to both the API key's team and its user.
      operationId: listShows
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Show"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
    post:
      description: Creates a show owned by the API key's team.
      operationId: createShow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShow"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Show"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing the show:create scope.
        "409":
          description: Show slug already exists.
  /s/shows/{show_slug}/episodes:
    get:
      description: Lists every episode for an accessible show, newest first.
      operationId: listEpisodes
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
        - name: limit
          in: query
          schema:
            $ref: "#/components/schemas/EpisodePageLimit"
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/EpisodePageCursor"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePage"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing the show:read scope.
        "404":
          description: Show was not found for the API key team and user.
  /s/shows/{show_slug}/members:
    get:
      operationId: listShowMembers
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowMemberCollection"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing show:read or its creator lacks effective show
            access.
        "404":
          description: Show not found.
  /s/shows/{show_slug}/invitations:
    post:
      operationId: createShowInvitation
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShowInvitation"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingShowInvitation"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Show not found.
        "409":
          description: Email already has effective access or a pending invitation.
  /s/shows/{show_slug}/invitations/{invitation_id}:
    parameters:
      - name: show_slug
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ShowSlug"
      - name: invitation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ShowInvitationID"
    put:
      operationId: updateShowInvitationRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShowMemberRole"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingShowInvitation"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Pending invitation not found.
    delete:
      operationId: revokeShowInvitation
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Invitation revoked.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Pending invitation not found.
  /s/shows/{show_slug}/members/{user_id}:
    parameters:
      - name: show_slug
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ShowSlug"
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UserID"
    put:
      operationId: updateShowMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShowMemberRole"
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Collaborator role changed.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Direct collaborator not found.
    delete:
      operationId: removeShowMember
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Collaborator removed.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing team:manage or its creator is not a team owner.
        "404":
          description: Direct collaborator not found.
  /s/shows/{show_slug}/deletions:
    post:
      operationId: createShowDeletion
      parameters:
        - name: show_slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowSlug"
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: "202"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPublicShowDeletion"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: The API key creator is no longer the show owner.
        "404":
          description: Show not found for the API key team.
  /s/show-deletions/{show_deletion_run_id}/events:
    get:
      operationId: showDeletionEvents
      parameters:
        - name: show_deletion_run_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShowDeletionRunID"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Durable show deletion progress and terminal events.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/ShowDeletionEvent"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: The API key creator is no longer the show owner.
        "404":
          description: Show deletion run not found.
  /s/episodes/{episode_id}/deletions:
    post:
      operationId: createEpisodeDeletion
      parameters:
        - name: episode_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EpisodeID"
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: "202"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPublicEpisodeDeletion"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: The API key is missing episode:delete or its creator is not a team
            owner.
        "404":
          description: Episode not found for the API key team.
  /s/episode-deletions/{episode_deletion_run_id}/events:
    get:
      operationId: episodeDeletionEvents
      parameters:
        - name: episode_deletion_run_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EpisodeDeletionRunID"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Durable episode deletion progress and terminal events.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/EpisodeDeletionEvent"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: The API key is missing episode:delete or its creator is not a team
            owner.
        "404":
          description: Episode deletion run not found.
  /s/image-uploads/presign:
    post:
      operationId: createImageUploadPresign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImageUploadPresign"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedImageUploadPresign"
        "400":
          description: Unsupported artwork upload.
        "401":
          description: Missing or invalid token.
        "402":
          description: An audio plan is required to upload files.
        "403":
          description: API key is missing the show:create scope.
        "409":
          description: Show ID is already in use.
  /s/image-uploads/{image_asset_id}/complete:
    post:
      operationId: completeImageUpload
      parameters:
        - name: image_asset_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ImageAssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteImageUpload"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAsset"
        "400":
          description: Invalid or unsupported uploaded image.
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing the show:create scope.
        "404":
          description: Uploaded image not found.
        "409":
          description: Image upload was already completed.
  /s/rss-imports:
    post:
      operationId: importRSS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRSSRequest"
      security:
        - ApiKeyAuth: []
      responses:
        "202":
          description: "202"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPublicRSSImport"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "402":
          description: "402"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSImportEntitlementError"
        "403":
          description: API key is missing the show:create scope.
        "409":
          description: Requested show slug is already used or conflicts with the choice
            owned by an existing import.
  /s/rss-imports/{import_run_id}/events:
    get:
      operationId: importRSSRunEvents
      parameters:
        - name: import_run_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ImportRunID"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: RSS import progress and terminal events.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/PublicRSSImportEvent"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing the show:read scope.
        "404":
          description: Import run not found.
  /s/episode-upload-sessions:
    post:
      description: Idempotently admits a resumable source upload without creating an
        episode.
      operationId: createEpisodeUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpisodeUploadSession"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadSession"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadSession"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "403":
          description: API key is missing the episode:create scope.
        "404":
          description: Show slug was not found for the API key team.
        "409":
          description: Source identity conflicts with the existing session.
        "410":
          description: The resumable upload attempt expired.
  /s/episode-upload-sessions/{upload_session_id}:
    parameters:
      - name: upload_session_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UploadSessionID"
    get:
      operationId: getEpisodeUploadSession
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadSession"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
        "410":
          description: The resumable upload session expired.
    put:
      operationId: updateEpisodeUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEpisodeUploadSession"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadSession"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
        "409":
          description: Session metadata can no longer be changed.
        "410":
          description: The resumable upload session expired.
    delete:
      description: Terminalizes a failed or abandoned intake and schedules durable
        object-store cleanup.
      operationId: cancelEpisodeUploadSession
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Upload session cancelled.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
        "409":
          description: Upload session already entered processing.
  /s/episode-upload-sessions/{upload_session_id}/parts/presign:
    post:
      operationId: presignEpisodeUploadSessionParts
      parameters:
        - name: upload_session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignEpisodeUploadSessionParts"
      security:
        - ApiKeyAuth: []
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedEpisodeUploadParts"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "402":
          description: An audio plan is required to upload files.
        "404":
          description: Episode upload session was not found.
        "409":
          description: Attempt is no longer accepting upload parts.
        "410":
          description: The resumable upload attempt expired.
  /s/episode-upload-sessions/{upload_session_id}/complete:
    post:
      description: Completes multipart upload from authoritative object-store
        ListParts state and starts durable processing.
      operationId: completeEpisodeUploadSession
      parameters:
        - name: upload_session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadSessionID"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
        "409":
          description: Authoritative multipart parts are incomplete or invalid.
        "410":
          description: The resumable upload attempt expired.
  /s/episode-upload-sessions/{upload_session_id}/events:
    get:
      operationId: episodeUploadSessionEvents
      parameters:
        - name: upload_session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadSessionID"
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Progress plus the durable safe-handoff or permanent-failure
            milestone.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/EpisodeProcessingEvent"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErr"
        "401":
          description: Missing or invalid token.
        "404":
          description: Episode upload session was not found.
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      description: Listenbox API key scoped to podcast management.
      scheme: bearer
  headers:
    ETag:
      description: HTTP entity tag for the selected OpenAPI representation.
      schema:
        type: string
      required: true
    Vary:
      description: The representation varies by the Accept request header.
      schema:
        type: string
        const: Accept
      required: true
  schemas:
    OpenAPIYAMLDocument:
      type: string
      description: Generated OpenAPI YAML document.
    OpenAPIJSONDocument:
      description: Generated OpenAPI JSON document.
      type: object
      properties: {}
      additionalProperties: false
    NonEmptyString:
      type: string
      minLength: 1
    ValidationLocation:
      type: string
      enum:
        - body
        - query
        - path
        - header
        - cookie
    string:
      type: string
    ValidationIssueCode:
      type: string
      description: Stable machine-readable validation failure code. Uses invalid,
        parse, required, JSON Schema keyword names, additionalProperties for
        unknown object fields, and format.<format> for named format failures.
      examples:
        - required
        - minLength
        - format.uri
        - additionalProperties
    ValidationIssue:
      type: object
      properties:
        in:
          $ref: "#/components/schemas/ValidationLocation"
        field:
          type: string
        path:
          type: array
          items:
            $ref: "#/components/schemas/string"
        code:
          $ref: "#/components/schemas/ValidationIssueCode"
        message:
          $ref: "#/components/schemas/NonEmptyString"
      required:
        - in
        - code
        - message
      additionalProperties: false
    ValidationErr:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/NonEmptyString"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
          minItems: 0
      required:
        - message
        - errors
      additionalProperties: false
    ApiKeyScope:
      type: string
      enum:
